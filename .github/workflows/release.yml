# Release Please + multi-platform build + GitHub Release.
#
# 流程:
#   1. push 到 main 后, release-please 根据 Conventional Commits 维护一个发版 PR
#      (自动汇总 commit、生成 CHANGELOG.md、升级 Cargo.toml 版本号)
#   2. 合并该 PR 后, release-please 创建 GitHub Release + tag (release_created=true)
#   3. build 任务并行编译所有平台, 上传产物到 GitHub Actions artifacts
#   4. upload 任务把产物附加到该 Release
#
# 注意: commit 信息需遵循 Conventional Commits (如 `feat: ...` / `fix: ...`),
#       否则不会被收录进发版 PR.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # 创建 release / 上传产物
  pull-requests: write   # 创建发版 PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # 自动同步 Cargo.toml 版本号并生成 CHANGELOG.md
          release-type: rust

  # ----------------------------------------------------------------------------
  # 跨平台编译: ubuntu / windows / macos × x86_64 / aarch64
  # 模型文件 (models/common_old.onnx) 已 commit, build job 直接 checkout 即可.
  # ----------------------------------------------------------------------------
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-gnu,    cross: false, upx: true  }
          - { os: ubuntu-latest,   target: aarch64-unknown-linux-gnu,   cross: true,  upx: true  }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc,     cross: false, upx: true  }
          - { os: macos-latest,    target: x86_64-apple-darwin,         cross: false, upx: false }
          - { os: macos-latest,    target: aarch64-apple-darwin,        cross: false, upx: false }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross

      - name: Install cross-linker deps (Linux)
        if: matrix.cross && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build release
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: UPX compress
        if: matrix.upx
        shell: bash
        run: |
          set -e
          BIN="i12377_api"
          EXT=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXT=".exe"; fi
          BIN_PATH="target/${{ matrix.target }}/release/${BIN}${EXT}"
          ls -la "$BIN_PATH"

          if command -v upx >/dev/null 2>&1; then
            # apt 装的 upx 对 aarch64-linux 是 x86_64 二进制, 用不了.
            # 用 GitHub release 的多架构二进制.
            case "${{ matrix.target }}" in
              *aarch64*)
                curl -fsSL -o /tmp/upx https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-arm64_linux.tar.xz
                tar -xJf /tmp/upx -C /tmp
                UPX_BIN="/tmp/upx-4.2.4-arm64_linux/upx"
                ;;
              *)
                # windows / linux x86_64 / musl: 用 apt 的即可
                UPX_BIN="$(command -v upx)"
                ;;
            esac
            if [ -x "$UPX_BIN" ]; then
              "$UPX_BIN" --best --lzma -f "$BIN_PATH"
              ls -la "$BIN_PATH"
            fi
          fi

      - name: Package
        shell: bash
        run: |
          set -e
          BIN="i12377_api"
          EXT=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXT=".exe"; fi
          PKG="${BIN}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}${EXT}" "dist/${BIN}${EXT}"
          cp README.md dist/ 2>/dev/null || true
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "../${PKG}.zip" .
          else
            tar -czf "../${PKG}.tar.gz" .
          fi
          cd ..
          echo "PKG_FILE=${PKG}.$( [[ "${{ matrix.target }}" == *windows* ]] && echo zip || echo tar.gz )" \
            >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: ${{ env.PKG_FILE }}
          retention-days: 1

  # ----------------------------------------------------------------------------
  # 把所有平台的产物上传到 release-please 创建的 GitHub Release.
  # ----------------------------------------------------------------------------
  upload:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # gh 命令需要 git 仓库上下文

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la dist/
          gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/* --clobber