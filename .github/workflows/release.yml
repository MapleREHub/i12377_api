# Release pipeline.
#
# Two trigger modes:
#   1. push to main         — release-please opens/updates a release PR.
#                              When merged, release-please creates a tag +
#                              GitHub Release; this workflow then builds
#                              and uploads artifacts to it.
#   2. workflow_dispatch    — manual re-run. Always builds + uploads to the
#                              most recent release matching the trigger's
#                              ref. Useful for retrying a failed build
#                              without cutting a new version.
#
# 注意: commit 信息需遵循 Conventional Commits (如 `feat: ...` / `fix: ...`),
#       否则不会被 release-please 收录进发版 PR.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach artifacts to (defaults to latest)'
        required: false
        default: ''

permissions:
  contents: write        # 创建 release / 上传产物
  pull-requests: write   # 创建发版 PR

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # 自动同步 Cargo.toml 版本号并生成 CHANGELOG.md
          release-type: rust

  # ----------------------------------------------------------------------------
  # 跨平台编译: ubuntu / windows / macos × x86_64 / aarch64
  # 模型文件 (models/common_old.onnx) 已 commit, build job 直接 checkout 即可.
  # 触发条件:
  #   - push 模式且 release-please 创建了 release (release_created=true)
  #   - workflow_dispatch 模式 (手动重跑)
  # ----------------------------------------------------------------------------
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
    needs: release-please
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-gnu,    upx: true  }
          - { os: ubuntu-latest,   target: aarch64-unknown-linux-gnu,   upx: true  }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc,     upx: true  }
          # macOS: ship arm64 only — Apple retired macOS-13 (Intel) in Dec 2024
          # and `macos-latest` is now Apple Silicon. Cross-building x86_64 from
          # arm64 is unreliable and most users have moved off Intel macs.
          - { os: macos-latest,    target: aarch64-apple-darwin,        upx: false }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker (aarch64-linux-gnu)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" \
            >> "$GITHUB_ENV"

      - name: Build release
        shell: bash
        run: |
          set -e
          cargo build --release --target ${{ matrix.target }}

      - name: UPX compress
        if: matrix.upx
        shell: bash
        run: |
          set -e
          BIN="i12377_api"
          EXT=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXT=".exe"; fi
          BIN_PATH="target/${{ matrix.target }}/release/${BIN}${EXT}"
          ls -la "$BIN_PATH"

          if [[ "${{ matrix.target }}" == *aarch64* ]]; then
            # apt 装的 upx 是 x86_64 的, 不能在 aarch64 runner 上跑.
            # 但 ubuntu-latest 的 aarch64 cross 仍跑在 x86_64 runner 上,
            # 所以 apt 的 upx 能用. windows runner 同理.
            UPX_BIN="$(command -v upx)"
          else
            UPX_BIN="$(command -v upx)"
          fi

          if [ -x "$UPX_BIN" ]; then
            "$UPX_BIN" --best --lzma -f "$BIN_PATH"
            ls -la "$BIN_PATH"
          fi

      - name: Package
        shell: bash
        run: |
          set -e
          BIN="i12377_api"
          EXT=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXT=".exe"; fi
          PKG="${BIN}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}${EXT}" "dist/${BIN}${EXT}"
          cp README.md dist/ 2>/dev/null || true
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "../${PKG}.zip" .
          else
            tar -czf "../${PKG}.tar.gz" .
          fi
          cd ..
          echo "PKG_FILE=${PKG}.$( [[ "${{ matrix.target }}" == *windows* ]] && echo zip || echo tar.gz )" \
            >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: ${{ env.PKG_FILE }}
          retention-days: 1

  # ----------------------------------------------------------------------------
  # 把所有平台的产物上传到目标 release.
  # tag_name 来源:
  #   - push 模式: release-please 输出的 tag
  #   - dispatch 模式: 用户传入的 tag_name (或默认取最新 release 的 tag)
  # ----------------------------------------------------------------------------
  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # gh 命令需要 git 仓库上下文

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
          TAG_FROM_RELEASE_PLEASE: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -e
          ls -la dist/
          TAG=""
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [ -n "$TAG_FROM_RELEASE_PLEASE" ]; then
            TAG="$TAG_FROM_RELEASE_PLEASE"
          else
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "Attaching $(ls dist | wc -l) artifacts to release $TAG"
          gh release upload "$TAG" dist/* --clobber